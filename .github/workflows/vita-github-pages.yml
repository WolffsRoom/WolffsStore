name: Vita GitHub Lite - Pages

on:
  push:
    branches: [main]
    paths:
      - 'vita-github/**'
      - '.github/workflows/vita-github-pages.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 */12 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: vita-github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout WolffsStore
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: vita-github/requirements.txt
      - name: Install generator dependencies
        run: pip install -r vita-github/requirements.txt
      - name: Test readable Shields.io badges
        run: python -m unittest discover -s vita-github/tests -p 'test_*.py' -v
      - name: Generate PS Vita-compatible static pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python vita-github/generate.py _site
      - name: Smoke test generated pages
        run: |
          test -s _site/index.html
          test -s _site/style.css
          test -s _site/WolffsRoom/WolffsStore/index.html
          test -s _site/WolffsRoom/DeltaruneVita/index.html
          test -s _site/WolffsRoom/DeltaruneVita/releases/index.html
          test -s _site/WolffsRoom/FileManager/index.html
          grep -q 'vita-badge' _site/WolffsRoom/FileManager/index.html
          if grep -Rqi '<script' _site --include='*.html'; then echo 'Unexpected script tag'; exit 1; fi
      - name: Verify FileManager dark logo and badge readability
        run: |
          python - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup
          content = Path("_site/WolffsRoom/FileManager/index.html").read_text("utf-8")
          soup = BeautifulSoup(content, "html.parser")
          logos = soup.select('img[alt="File Manager for PlayStation Vita"]')
          assert len(logos) == 1, "Expected exactly one FileManager logo"
          assert "preta" not in logos[0]["src"].lower(), "Light-theme logo must be excluded"
          assert len(soup.select("span.vita-badge")) >= 4, "Expected HTML-rendered badges"
          assert all("font-size:15px" in item.get("style","") for item in soup.select("span.vita-badge"))
          assert "dark3" in content, "Dark CSS revision missing"
          print("Dark logo and readable badges verified")
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
