name: Build e Release

on:
  push:
    branches: [main, feature/touchonvita-installer]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vpk:
    runs-on: ubuntu-latest
    container: vitasdk/vitasdk:latest
    steps:
      - uses: actions/checkout@v4
      - name: Bibliotecas (vita2d e dependências)
        run: |
          if [ ! -f "$VITASDK/arm-vita-eabi/lib/libvita2d.a" ]; then
            vdpm install vita2d libpng libjpeg-turbo freetype bzip2 zlib || vdpm vita2d libpng libjpeg-turbo freetype bzip2 zlib
          fi
      - name: ZIP AES - garantir libzip no VitaSDK
        run: |
          if [ ! -f "$VITASDK/arm-vita-eabi/lib/libzip.a" ]; then
            vdpm install libzip || vdpm libzip
          fi
          test -f "$VITASDK/arm-vita-eabi/lib/libzip.a"
      - name: Compilar
        run: |
          cmake -S . -B build-vita -DCMAKE_BUILD_TYPE=Release
          cmake --build build-vita -j2
          ls -la artifacts/current
      - name: Conferir nome fixo do VPK
        run: test -f artifacts/current/WolffsStore.vpk
      - uses: actions/upload-artifact@v4
        with:
          name: WolffsStore-vpk
          path: artifacts/current/WolffsStore.vpk
      - name: Publicar release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Wolff's Store ${{ github.ref_name }}
          files: artifacts/current/WolffsStore.vpk
          body: |
            Wolff's Store ${{ github.ref_name }} — o site Wolff's Room no PS Vita.
            Instale o VPK com o VitaShell. Não há dados extras para ux0:data.
